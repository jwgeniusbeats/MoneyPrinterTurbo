<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f3eadb; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="50" data-width="1080" data-height="1920">
      <div id="spoel-opwinden" data-composition-id="spoel-opwinden" data-composition-src="compositions/spoel-opwinden.html"
        data-start="0" data-duration="21" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="spoel-inleggen" data-composition-id="spoel-inleggen" data-composition-src="compositions/spoel-inleggen.html"
        data-start="21" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="bovendraad" data-composition-id="bovendraad" data-composition-src="compositions/bovendraad.html"
        data-start="33" data-duration="17" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
