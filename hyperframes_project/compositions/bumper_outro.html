<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"brand","type":"string","label":"Brand name","default":"Nognize","maxLength":24},{"id":"handle","type":"string","label":"Handle","default":"@nognize","maxLength":30},{"id":"cta","type":"string","label":"Call to action","default":"Follow for more psychology facts","maxLength":60},{"id":"duration","type":"number","label":"Duration in seconds","default":1.8}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>bumper-outro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0b12;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(circle at 50% 50%, #1b1b2e 0%, #0b0b12 70%);
        text-align: center;
        padding: 0 90px;
      }
      #logo {
        width: 180px;
        height: 180px;
        object-fit: contain;
      }
      #brand {
        color: #f4f4f5;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #brand .dot {
        color: #8b8bff;
      }
      #cta {
        color: #f4f4f5;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      #handle {
        color: #8b8bff;
        font-size: 40px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="main"
      data-start="0"
      data-duration="1.8"
      data-width="1080"
      data-height="1920"
    >
      <img id="logo" src="assets/logo.png" alt="" />
      <div id="brand">Nognize<span class="dot">.</span></div>
      <div id="cta">Follow for more psychology facts</div>
      <div id="handle">@nognize</div>
    </div>
    <script>
      (function () {
        var vars =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        if (vars.brand) document.getElementById("brand").firstChild.textContent = vars.brand;
        if (vars.cta) document.getElementById("cta").textContent = vars.cta;
        if (vars.handle) document.getElementById("handle").textContent = vars.handle;
        var duration = typeof vars.duration === "number" && vars.duration > 0 ? vars.duration : 1.8;
        document.getElementById("root").setAttribute("data-duration", String(duration));

        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#logo", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0);
        tl.fromTo("#brand", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 0.1);
        tl.fromTo("#cta", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45 }, 0.4);
        tl.fromTo("#handle", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4 }, 0.7);
        tl.to({}, { duration: Math.max(duration - 1.2, 0.1) }, 1.1);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
